services:
  - type: web
    name: virar-organics
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
